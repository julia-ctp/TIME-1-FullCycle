name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env files
        run: |
            cp rotaeBackend/.env.example rotaeBackend/.env
            cp rotaeFrontend/.env.example rotaeFrontend/.env

      - name: Build and run Docker Compose
        run: docker compose up -d --build
